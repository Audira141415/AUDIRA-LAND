<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pratinjau Rumah Jawa</title>
<style>
  :root { --krem:#FFF9EC; --kayu:#5B3A24; --terakota:#C8553D; --emas:#E9A91E; }
  html,body { margin:0; height:100%; background:var(--krem); font-family:system-ui,sans-serif; color:var(--kayu); overflow:hidden; }
  canvas { display:block; }
  #panel { position:fixed; left:12px; top:12px; right:12px; max-width:420px; background:rgba(255,249,236,.92);
           border:2px solid var(--kayu); border-radius:10px; padding:10px 12px; font-size:13px; line-height:1.45; }
  #panel b { color:var(--terakota); }
  #panel .row { display:flex; gap:6px; margin-top:6px; flex-wrap:wrap; }
  button { border:2px solid var(--kayu); background:var(--emas); color:var(--kayu); border-radius:6px; padding:4px 10px; font-weight:600; cursor:pointer; }
  button.on { background:var(--terakota); color:var(--krem); }
</style>
</head>
<body>
<div id="panel">
  <div><b>AUDIRA-LAND · Rumah Jawa</b> — joglo (2×2 kavling), limasan, kampung, panggang pe (warung), tajug (langgar) (1 kavling)</div>
  <div id="info">Memuat…</div>
  <div class="row">
    <button data-view="all" class="on">Semua</button>
    <button data-view="joglo">Joglo</button>
    <button data-view="limasan">Limasan</button>
    <button data-view="kampung">Kampung</button>
    <button data-view="panggangpe">Panggang pe</button>
    <button data-view="tajug">Tajug</button>
    <button id="grid">Kavling 8 m</button>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function () {
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  document.body.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xcfe3f2);
  const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.5, 400);
  camera.position.set(10, 24, 62);
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.target.set(8, 2.5, 0);
  controls.enableDamping = true;

  scene.add(new THREE.HemisphereLight(0xfff4e0, 0x8a7a5a, 0.75));
  const sun = new THREE.DirectionalLight(0xfff1d6, 1.0);
  sun.position.set(-10, 30, 22); sun.target.position.set(8, 0, 0); scene.add(sun.target);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -32, right: 32, top: 32, bottom: -32, near: 1, far: 120 });
  sun.shadow.bias = -0.0005;
  scene.add(sun);

  const ground = new THREE.Mesh(new THREE.PlaneGeometry(120, 120),
    new THREE.MeshLambertMaterial({ color: new THREE.Color(0xa7b57a).convertSRGBToLinear() }));
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  // grid kavling 8 m (joglo 16x16 di x=-9, limasan 8x8 di x=+8)
  const grid = new THREE.Group();
  function lot(cx, size) {
    const g = new THREE.EdgesGeometry(new THREE.PlaneGeometry(size, size));
    const l = new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color: 0xc8553d }));
    l.rotation.x = -Math.PI / 2; l.position.set(cx, 0.02, 0); grid.add(l);
  }
  const LAYOUT = { joglo: [-14, 16], limasan: [0, 8], kampung: [10, 8], panggangpe: [20, 8], tajug: [30, 8] };
  Object.values(LAYOUT).forEach(([x, s]) => lot(x, s));
  grid.visible = false;
  scene.add(grid);

  const items = {};
  Object.entries(LAYOUT).forEach(([k, [x, s]]) => { items[k] = { url: 'public/models/rumah_' + k + '.glb', x, s }; });
  const loader = new THREE.GLTFLoader();
  const lines = [];
  let pending = Object.keys(items).length;
  Object.entries(items).forEach(([key, it]) => {
    loader.load(it.url, (gltf) => {
      const root = gltf.scene;
      let tris = 0, mats = new Set();
      root.traverse((o) => {
        if (o.isMesh) {
          o.castShadow = o.receiveShadow = true;
          const g = o.geometry;
          tris += (g.index ? g.index.count : g.attributes.position.count) / 3;
          mats.add(o.material.uuid);
        }
      });
      const box = new THREE.Box3().setFromObject(root);
      const s = box.getSize(new THREE.Vector3());
      root.position.x = it.x;
      scene.add(root);
      it.root = root;
      lines.push(`<b>${key}</b>: ${tris} segitiga · ${mats.size} material · ${s.x.toFixed(2)}×${s.z.toFixed(2)}×${s.y.toFixed(2)} m · dasar y=${box.min.y.toFixed(3)}`);
      if (--pending === 0) {
        document.getElementById('info').innerHTML = lines.sort().join('<br>');
        window.__previewReady = true;
      }
    }, undefined, (e) => { document.getElementById('info').textContent = 'Gagal memuat ' + it.url + ': ' + e; });
  });

  document.querySelectorAll('button[data-view]').forEach((b) => b.addEventListener('click', () => {
    document.querySelectorAll('button[data-view]').forEach((x) => x.classList.toggle('on', x === b));
    const v = b.dataset.view;
    Object.entries(items).forEach(([k, it]) => { if (it.root) it.root.visible = v === 'all' || v === k; });
    if (v === 'all') { controls.target.set(8, 2.5, 0); camera.position.set(10, 24, 62); }
    else { const it = items[v], d = it.s * 1.35; controls.target.set(it.x, it.s > 8 ? 3 : 2.2, 0); camera.position.set(it.x + d * 0.45, d * 0.55, d * 1.1); }
  }));
  document.getElementById('grid').addEventListener('click', (e) => { grid.visible = !grid.visible; e.target.classList.toggle('on', grid.visible); });

  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight);
  });
  (function loop() { requestAnimationFrame(loop); controls.update(); renderer.render(scene, camera); })();
})();
</script>
</body>
</html>
